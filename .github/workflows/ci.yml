name: CI

# main is deployed to production on every push, so every PR must leave it deployable.
on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

jobs:
    prettier:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: package.json
                  cache: npm
            - run: npm ci
            - run: npm run prettier-check

    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: package.json
                  cache: npm
            - run: npm ci
            - run: npm run build
            # gzipped JS <= 300 KiB, CSS <= 50 KiB, font <= 60 KiB
            - run: npm run budgets

    # Audits the real pages, connected: a back is seeded with its own scripts (the rooms, the
    # editions and the test accounts) on a MongoDB service, and scripts/lighthouse-login.js logs
    # in one of its test accounts before the runs
    lighthouse:
        runs-on: ubuntu-latest

        services:
            mongodb:
                image: mongo:7
                ports:
                    - 27017:27017

        env:
            MONGO_CONNECTION: mongodb://localhost:27017/Userdb
            # Read by the bundle at build time and by server.js for its CSP
            API_URL: http://localhost:3000
            # The shotgun board is shown whatever the date of the seeded editions
            HAS_STARTED: true

        steps:
            - uses: actions/checkout@v7
            - uses: actions/checkout@v7
              with:
                  repository: TanguyLe/HoulgateFestBack
                  path: back
            - uses: actions/setup-node@v7
              with:
                  node-version-file: package.json
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      back/package-lock.json
            - name: Seed and start the back
              working-directory: back
              run: |
                  npm ci
                  npm run initDB
                  npm run createTestRecords
                  HAS_STARTED=1 FRONT_HOST=http://localhost:8000 nohup npx env-cmd --no-override -f back-dev-env.env node server.js > back.log 2>&1 &
                  npx --yes wait-on@8 --timeout 60000 tcp:3000
            - run: npm ci
            - run: npm run build
            # lhci runs the login script with puppeteer, which it doesn't ship
            - run: npm install --no-save puppeteer@24
              env:
                  # lhci drives the runner's Chrome
                  PUPPETEER_SKIP_DOWNLOAD: true
            # /, /history and /shotgun on a phone: >= 95 in every category (lighthouserc.json)
            - run: npx --yes @lhci/cli@0.15.1 autorun
              env:
                  # The runner's Chrome: puppeteer's own isn't downloaded
                  CHROME_PATH: /usr/bin/google-chrome
            - if: failure()
              run: cat back/back.log
