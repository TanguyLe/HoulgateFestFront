name: CI

# main is deployed to production on every push, so every PR must leave it deployable.
on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

jobs:
    prettier:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: package.json
                  cache: npm
            - run: npm ci
            - run: npm run prettier-check

    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: package.json
                  cache: npm
            - run: npm ci
            - run: npm run build
            # gzipped JS <= 300 KiB, CSS <= 50 KiB, font <= 60 KiB
            - run: npm run budgets

    lighthouse:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: package.json
                  cache: npm
            - run: npm ci
            - run: npm run build
            # /, /history and /shotgun on a phone: >= 95 in every category (lighthouserc.json)
            - run: npx --yes @lhci/cli@0.15.1 autorun
