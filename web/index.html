<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="-1" />
        <meta http-equiv="pragma" content="no-cache" />
        <meta
            name="description"
            content="HoulgateFest, le week-end festif normand entre amis : shotgun des chambres, trajets et scores."

        <meta name="theme-color" content="#f8efdd" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#12100e" media="(prefers-color-scheme: dark)" />
        <link rel="icon" type="image/png" href="/static/favicon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap"
        />
        <title>HoulgateFest</title>
        <!-- Applies the saved theme before the first paint, a file so the CSP can forbid inline scripts -->
        <script src="/static/theme.js"></script>
    </head>
    <body>
        <div id="app"></div>
        <script src="/houlgatefest.min.js"></script>
    </body>
